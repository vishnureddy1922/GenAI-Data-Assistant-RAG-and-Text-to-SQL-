name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run the LLM evaluation (uses the OPENAI_API_KEY secret)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov httpx ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (fake LLM, SQLite warehouse; no API key needed)
        run: pytest --cov --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t genai-data-assistant-api .
      - run: docker build -f ui/Dockerfile -t genai-data-assistant-ui .

  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    runs-on: ubuntu-latest
    needs: test
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assistant" --health-interval 5s --health-retries 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql+psycopg://assistant:assistant@localhost:5432/assistant
      READONLY_DATABASE_URL: postgresql+psycopg://assistant_ro:assistant_ro@localhost:5432/assistant
      PGPASSWORD: assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Load warehouse schema and data
        run: for f in sql/init/*.sql; do psql -h localhost -U assistant -d assistant -v ON_ERROR_STOP=1 -f "$f"; done
      - run: python -m app.ingest
      - run: python -m eval.run_eval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/report.json
