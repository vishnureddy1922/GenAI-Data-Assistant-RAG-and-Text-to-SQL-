name: genai-data-assistant

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      retries: 20

  ingest:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:assistant@db:5432/assistant
    command: ["python", "-m", "app.ingest"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:assistant@db:5432/assistant
      READONLY_DATABASE_URL: postgresql+psycopg://assistant_ro:assistant_ro@db:5432/assistant
    ports:
      - "8000:8000"
    depends_on:
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      ASSISTANT_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg-data:
