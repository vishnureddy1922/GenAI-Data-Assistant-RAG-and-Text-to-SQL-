[project]
name = "genai-data-assistant"
version = "1.0.0"
description = "Ask business questions in plain English: text-to-SQL with guardrails plus RAG over data docs"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/factory.py", "app/ingest.py", "app/llm.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval", "tests"]

[tool.ruff.lint.per-file-ignores]
"app/prompts.py" = ["E501"]
